# ponytail: MongoDB fica de fora porque já existe um mongod local na 27017.
# Se não tiver Mongo instalado, rode com: docker compose --profile mongo up -d
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: wiremock
    ports:
      - "8082:8080"
    volumes:
      - ./wiremock:/home/wiremock

  mongodb:
    image: mongo:7
    container_name: mongodb
    profiles: ["mongo"]
    ports:
      - "27017:27017"
